name: Release

# Tag im Format vX.Y.Z (z.B. v1.0.0) -> baut Release-Build und veroeffentlicht
# ihn als GitHub Release. Manuelles Ausloesen (workflow_dispatch) ist ebenfalls
# moeglich, erzeugt dann aber nur das Build-Artifact zum Pruefen, kein Release
# (siehe "if" am letzten Schritt) - so laesst sich der Build testen, ohne
# gleich einen Tag setzen zu muessen.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # .NET Framework 4.8 braucht den vollen Windows-Build; windows-latest
    # bringt Developer Pack + Targeting Pack fuer net48 bereits mit.
    runs-on: windows-latest

    # GitHub Actions erlaubt "secrets.*" nicht direkt in einer Step-"if:"-
    # Bedingung ("Unrecognized named-value: 'secrets'") - deshalb hier einmal
    # in den env-Kontext durchreichen, der in "if:" gelesen werden darf.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Versionsnummer kommt ab jetzt IMMER vom Git-Tag, nicht mehr von Hand
      # aus der csproj. Vorher wurde bei jedem Release (v0.1.1, v0.1.2, v0.1.3)
      # nur der Git-Tag erhoeht, die <Version> in BasicInstaller.csproj blieb
      # faelschlich auf "0.1.0" stehen - Footer UND der Update-Check
      # (vergleicht GitHub-Tag gegen die eingebaute Assembly-Version) zeigten
      # dadurch dauerhaft die falsche installierte Version an. Bei einem
      # Tag-Push (vX.Y.Z) wird das "v" abgeschnitten und per /p:Version an
      # dotnet build durchgereicht; bei workflow_dispatch ohne Tag bleibt der
      # csproj-Default (jeweils beim letzten Release von Hand aktualisiert).
      - name: Versionsnummer aus Git-Tag ermitteln
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-Build
        shell: bash
        run: |
          # Copyright-Jahr kommt vom Build-Datum des Runners, damit "© 2026"
          # nicht jedes Jahr von Hand in der csproj nachgezogen werden muss -
          # der Fenster-Footer selbst nutzt ohnehin schon DateTime.Now.Year
          # und ist davon unabhaengig immer aktuell.
          year=$(date +%Y)
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            dotnet build src/BasicInstaller/BasicInstaller.csproj -c Release \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:AssemblyVersion=${{ steps.version.outputs.value }}.0 \
              -p:FileVersion=${{ steps.version.outputs.value }}.0 \
              -p:Copyright="© $year AS Computertechnik"
          else
            dotnet build src/BasicInstaller/BasicInstaller.csproj -c Release \
              -p:Copyright="© $year AS Computertechnik"
          fi

      # Code-Signing ist komplett optional und bricht ohne eingerichtete
      # Secrets nichts - siehe README/CLAUDE.md "Code-Signing" fuer die
      # Einrichtung (Azure Artifact Signing, vormals "Trusted Signing").
      # Muss VOR dem Zippen/Inno-Setup-Bau passieren, damit sowohl die ZIP
      # als auch der Installer die signierte exe enthalten.
      - name: exe signieren (optional - nur wenn Azure-Secrets gesetzt sind)
        if: ${{ env.AZURE_TENANT_ID != '' }}
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: src/BasicInstaller/bin/Release/net48
          files-folder-filter: exe

      - name: Build-Ausgabe zippen
        shell: pwsh
        run: |
          $out = "src/BasicInstaller/bin/Release/net48"
          $zipName = "BasicInstaller-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zipName -Force
          echo "ZIP_PATH=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Als Build-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BasicInstaller-${{ github.ref_name }}
          path: ${{ env.ZIP_PATH }}

      - name: Installer mit Inno Setup bauen (optional)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer/setup.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "Inno-Setup-Build ist fehlgeschlagen (Exit-Code $LASTEXITCODE)."
            }
            $setupExe = "installer/Output/BasicInstaller-Setup.exe"
            if (Test-Path $setupExe) {
              echo "SETUP_PATH=$setupExe" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          } else {
            Write-Warning "Inno Setup (ISCC.exe) wurde auf diesem Runner nicht unter '$iscc' gefunden - Installer-Schritt wird uebersprungen."
          }

      - name: Setup.exe signieren (optional - nur wenn Azure-Secrets gesetzt sind)
        if: ${{ env.AZURE_TENANT_ID != '' && env.SETUP_PATH != '' }}
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: installer/Output
          files-folder-filter: exe

      - name: GitHub Release erstellen und Dateien anhaengen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=("${{ env.ZIP_PATH }}")
          if [ -n "${{ env.SETUP_PATH }}" ] && [ -f "${{ env.SETUP_PATH }}" ]; then
            assets+=("${{ env.SETUP_PATH }}")
          fi
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
